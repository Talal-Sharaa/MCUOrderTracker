<!doctype html>
<html lang="en" style="color-scheme: dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MCU Watch Order – Ultimate Marvel Tracker</title>
        <meta name="description" content="The most complete Marvel Cinematic Universe watch order tracker. Track your progress through movies, series, and specials in release or chronological order with a clean, accessible interface." />
        <meta name="theme-color" content="#05070A" />
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg-app: #05070a;
                --bg-surface: #0f1218;
                --bg-header: rgba(5, 7, 10, 0.85);
                --accent-red: #dc2626;
                --text-primary: #f8fafc;
                --text-secondary: #cbd5e1;
                --font-main: 'Inter', system-ui, -apple-system, sans-serif;
                --font-display: 'Bebas Neue', sans-serif;
            }
            body {
                background: var(--bg-app);
                color: var(--text-primary);
                font-family: var(--font-main);
                margin: 0;
            }
            #header {
                position: sticky;
                top: 0;
                z-index: 100;
                background: var(--bg-header);
                backdrop-filter: blur(16px);
                border-bottom: 1px solid #1e293b;
                padding: 1.5rem 1rem 1rem;
                min-height: 140px;
            }
            .header-top {
                max-width: 1200px;
                margin: 0 auto 1.5rem;
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
            }
            .main-title {
                font-family: var(--font-display);
                font-size: clamp(2.5rem, 8vw, 4rem);
                margin: 0;
                line-height: 0.85;
            }
        </style>
        <link rel="stylesheet" href="style.css?v=1.0.1" />
        <script src="data.js?v=1.0.1" defer></script>
        <script src="store.js?v=1.0.1" defer></script>
        <script src="templates.js?v=1.0.1" defer></script>
        <script src="ui.js?v=1.0.1" defer></script>
        <script src="controller.js?v=1.0.1" defer></script>
    </head>

    <body>
        <a href="#main-content" class="skip-link">Skip to Main Content</a>
        <div id="app">
            <header id="header">
                <div class="header-top">
                    <div class="brand">
                        <div class="eyebrow" translate="no">Marvel&nbsp;Cinematic&nbsp;Universe</div>
                        <h1 class="main-title">Watch Order</h1>
                    </div>
                    <div class="header-actions">
                        <button id="header-toggle" class="icon-btn" aria-label="Collapse header options" aria-expanded="true" aria-controls="header-expandable">
                            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g><path d="m18 15-6-6-6 6"/></g></svg>
                        </button>
                        <nav class="view-toggle" aria-label="Order view">
                            <a href="?view=release" class="toggle-btn active" data-view="release" role="button" aria-pressed="true">
                                Release
                            </a>
                            <a href="?view=chrono" class="toggle-btn" data-view="chrono" role="button" aria-pressed="false">
                                Chrono
                            </a>
                        </nav>
                    </div>
                </div>

                <div id="header-expandable" class="expandable-wrapper">
                    <div class="expandable-content">
                        <div class="stats-grid" id="stats">
                            <!-- Stats injected here -->
                        </div>

                        <div class="controls-bar">
                            <div class="search-container">
                                <label for="search-input" class="sr-only">Search MCU titles</label>
                                <svg class="icon search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                                <input
                                    type="search"
                                    class="search-input"
                                    id="search-input"
                                    name="search"
                                    placeholder="Search titles (e.g. Iron Man)…"
                                    spellcheck="false"
                                    inputmode="search"
                                    enterkeyhint="search"
                                />
                                <button
                                class="clear-btn"
                                id="clear-search"
                                aria-label="Clear search"
                                style="display: none"
                            >
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
                            </button>
                        </div>
                        <div class="filters-container">
                            <div class="filter-group" id="status-filter-group">
                                <button class="filter-trigger" id="status-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="status-options" aria-label="Filter by Status. Current: All">
                                    <span class="trigger-label">Status</span>
                                    <span class="trigger-value">All</span>
                                    <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g><path d="m6 9 6 6 6-6"/></g></svg>
                                </button>
                                <div class="filter-options" id="status-options" role="listbox">
                                    <button class="filter-btn active" data-filter="all" role="option" aria-selected="true">All</button>
                                    <button class="filter-btn" data-filter="none" role="option" aria-selected="false">Untracked</button>
                                    <button class="filter-btn" data-filter="watched" role="option" aria-selected="false">Watched</button>
                                    <button class="filter-btn" data-filter="watching" role="option" aria-selected="false">Watching</button>
                                    <button class="filter-btn" data-filter="will-watch" role="option" aria-selected="false">Will Watch</button>
                                    <button class="filter-btn" data-filter="skip" role="option" aria-selected="false">Skip</button>
                                </div>
                            </div>

                            <div class="filter-group" id="type-filter-group">
                                <button class="filter-trigger" id="type-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="type-options" aria-label="Filter by Type. Current: All">
                                    <span class="trigger-label">Type</span>
                                    <span class="trigger-value">All</span>
                                    <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g><path d="m6 9 6 6 6-6"/></g></svg>
                                </button>
                                <div class="filter-options" id="type-options" role="listbox">
                                    <button class="filter-btn active" data-type="all" role="option" aria-selected="true">All Types</button>
                                    <button class="filter-btn" data-type="movie" role="option" aria-selected="false">Movies</button>
                                    <button class="filter-btn" data-type="series" role="option" aria-selected="false">Series</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <main id="main-content">
                <h2 id="list-heading" class="sr-only">Marvel Cinematic Universe Titles</h2>
                <div id="results-announcer" class="sr-only" aria-live="polite"></div>
                <ul id="list-container" aria-labelledby="list-heading"></ul>
            </main>

            <button id="top-btn" class="top-btn" aria-label="Back to top" style="display: none">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g><path d="m18 15-6-6-6 6"/></g></svg>
            </button>
        </div>
    </body>
</html>
